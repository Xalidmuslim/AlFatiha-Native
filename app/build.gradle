plugins { id 'com.android.application' }

def uploadStoreFile = System.getenv('ANDROID_UPLOAD_STORE_FILE')
def uploadStorePassword = System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
def hasUploadSigning = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

def heartGeneratedRes = layout.buildDirectory.dir('generated/heart-design/res').get().asFile
def heartHeroParts = [
    file('src/main/icon/heart_prayer_hero.part1'),
    file('src/main/icon/heart_prayer_hero.part2'),
    file('src/main/icon/heart_prayer_hero.part3'),
    file('src/main/icon/heart_prayer_hero.part4'),
]
def heartDesignAssets = [
    [src: file('src/main/icon/heart_prayer_logo.b64'), out: 'heart_prayer_logo_exact.webp'],
    [src: file('src/main/icon/icon_quran.b64'), out: 'icon_quran_3d.webp'],
    [src: file('src/main/icon/icon_mosque.b64'), out: 'icon_mosque_3d.webp'],
    [src: file('src/main/icon/icon_quiz.b64'), out: 'icon_quiz_3d.webp'],
    [src: file('src/main/icon/icon_azkar.b64'), out: 'icon_azkar_3d.webp'],
]

tasks.register('prepareHeartDesignAssets') {
    def outputDir = new File(heartGeneratedRes, 'drawable-nodpi')
    inputs.files(heartDesignAssets.collect { it.src } + heartHeroParts)
    outputs.dir(outputDir)
    doLast {
        outputDir.mkdirs()

        String heroEncoded = heartHeroParts.collect { it.getText('UTF-8') }.join('').replaceAll('\\s+','')
        byte[] heroBytes = java.util.Base64.decoder.decode(heroEncoded)
        if (heroBytes.length < 5000) throw new GradleException('Invalid Heart Prayer hero asset')
        new File(outputDir, 'heart_prayer_hero_exact.webp').bytes = heroBytes

        heartDesignAssets.each { spec ->
            String encoded = spec.src.getText('UTF-8').replaceAll('\\s+','')
            byte[] bytes = java.util.Base64.decoder.decode(encoded)
            if (bytes.length < 1000) throw new GradleException("Invalid Heart Prayer asset: " + spec.src)
            new File(outputDir, spec.out).bytes = bytes
        }
    }
}

android {
    namespace 'app.alfatiha.tafsir'
    compileSdk 36

    defaultConfig {
        applicationId 'app.alfatiha.tafsir'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '1.2.3'
    }

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir heartGeneratedRes
        }
    }

    buildTypes {
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':azkar')
}


tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareHeartDesignAssets')
}
