name: Build Madarij 1.10 Performance APK

on:
  push:
    branches: [ madarij-v11-build-20261007 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Madarij source
        shell: bash
        run: |
          mkdir -p source
          cat payload/part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/madarij.tar.xz
          tar -xJf /tmp/madarij.tar.xz -C source
          chmod +x source/gradlew
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply performance patch
        shell: bash
        run: |
          cd source
          patch -p1 --forward < ../patches/madarij-v110-performance.patch

      - name: Create test signing key
        shell: bash
        run: |
          mkdir -p source/development-signing
          if [ ! -f source/development-signing/debug.keystore ]; then
            keytool -genkeypair -noprompt               -keystore source/development-signing/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify content
        working-directory: source
        run: python3 -m tools.content_gate app/src/main/assets/corpus.json

      - name: Build optimized release APK
        working-directory: source
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-v1.10-performance-APK
          path: source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
