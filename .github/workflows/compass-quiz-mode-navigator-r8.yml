name: Compass Quiz Mode Navigator R8 APK

on:
  push:
    branches: [codex/compass-quiz-mode-navigator-20261112]
  workflow_dispatch:

concurrency:
  group: compass-quiz-mode-navigator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify 13 quiz modes, named cards, contextual Contents and regressions
        run: |
          set -e
          python3 scripts/verify_azkar_tarifi_edition.py
          python3 scripts/verify_azkar_amal_text_review.py
          python3 scripts/verify_azkar_mulk_verse_layout.py
          python3 scripts/verify_compass_azkar_dashboard_ux.py
          python3 scripts/verify_compass_flat_cards.py
          python3 scripts/verify_quiz_mode_navigator.py
          python3 scripts/verify_compass_unified_ux.py
          python3 scripts/verify_compass_sand_spring.py
          python3 scripts/verify_compass_premium_home.py
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Azkar tests, Android lint and quiz-mode navigator R8 APK
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assembleQuizModeNavigatorCompare --no-daemon --stacktrace
      - name: Verify APK and bundled content
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/quizModeNavigatorCompare/app-quizModeNavigatorCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.quiznav1112'
          unzip -l "$APK" | grep -F 'assets/fonts/Neucha.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload separate APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Quiz-Navigator-20261112
          path: app/build/outputs/apk/quizModeNavigatorCompare/app-quizModeNavigatorCompare.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish tested standalone APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=compass-heart-quiz-navigator-20261112
          APK="$RUNNER_TEMP/Compass-Heart-Quiz-Navigator-20261112.apk"
          cp app/build/outputs/apk/quizModeNavigatorCompare/app-quizModeNavigatorCompare.apk "$APK"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Компас сердца — навигатор викторин по режимам и темам вопросов" \
              --notes "Тестовая APK: навигатор больше не создаёт 555 безымянных плиток на одном экране. Отдельная кнопка Разделы викторин ведёт к 13 реальным режимам: классическая, Аль-Фатиха средний, два верных, сопоставление, хадис-смысл, без вариантов, эксперт, Тайны молитвы средний/сложный, Проверка понимания, экзамен, ошибки осознанного чтения, жизненные ситуации. В выбранном режиме открываются компактные карточки с номером, коротким смыслом самого вопроса и состоянием ответа/ошибки/закладки; загрузка по 24 карточки. В аналитике нижнее Содержание теперь ведёт в навигатор заданий, не в главный каталог. Сохранён общий учёт повторяющихся вопросов и все старые данные. Не проводилась реальная визуальная проверка на телефоне или измерение FPS." \
              --prerelease
          fi
