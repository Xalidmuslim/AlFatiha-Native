name: Build Madarij APK

on:
  push:
    branches: [ madarij-build-v11 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q madarij-source.zip -d buildsrc
          test -f buildsrc/Madarij-Native-v11/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: buildsrc/Madarij-Native-v11
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s buildsrc/Madarij-Native-v11/app/build/outputs/apk/debug/app-debug.apk
          ls -lh buildsrc/Madarij-Native-v11/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Volume1-v1.9-reader-flow
          path: buildsrc/Madarij-Native-v11/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
