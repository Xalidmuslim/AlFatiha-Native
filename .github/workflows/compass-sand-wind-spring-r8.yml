name: Compass Sand Wind + Spring R8 APK

on:
  push:
    branches: [codex/compass-sand-wind-spring-neucha-20261108]
  workflow_dispatch:

concurrency:
  group: compass-sand-spring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Android and content regression contracts
        run: |
          python3 scripts/verify_compass_sand_spring.py
          python3 scripts/verify_compass_premium_home.py
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Unit tests, lint and optimized R8 Android APK
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assembleSandSpringCompare --no-daemon --stacktrace
      - name: Validate APK signature and bundled text data
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/sandSpringCompare/app-sandSpringCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.compasssandspring1108'
          unzip -l "$APK" | grep -F 'assets/fonts/Neucha.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload checked APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Sand-Wind-Spring-R8-APK
          path: app/build/outputs/apk/sandSpringCompare/app-sandSpringCompare.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct public APK download as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=compass-heart-sand-wind-spring-20261108
          APK="$RUNNER_TEMP/Compass-Heart-Sand-Wind-Spring-20261108.apk"
          cp app/build/outputs/apk/sandSpringCompare/app-sandSpringCompare.apk "$APK"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Компас сердца — песок, ветер и пружинные карточки" \
              --notes "Отдельный Android R8 APK: разборчивый кириллический рукописный шрифт Neucha, восстановленная песочная анимация с ветром, глубокое физическое пружинное нажатие карточек вместо каскадного появления. Старая версия и локальные данные не заменяются." \
              --prerelease
          fi
