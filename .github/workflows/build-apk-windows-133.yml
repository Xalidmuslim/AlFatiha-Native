name: Build APK 1.3.33 Windows

on:
  push:
    branches:
      - build/apk-1.3.33-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify content and navigation contracts
        run: python scripts/verify_content.py

      - name: Build debug APK
        run: .\gradlew.bat assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
