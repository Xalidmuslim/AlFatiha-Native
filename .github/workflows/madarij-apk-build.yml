name: Build Madarij APK

on:
  push:
    branches:
      - madarij-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Madarij project
        shell: bash
        run: |
          rm -rf /tmp/madarij
          mkdir -p /tmp/madarij
          unzip -q madarij-build/source.zip -d /tmp/madarij
          mkdir -p /tmp/madarij/app/src/main/assets
          gunzip -c madarij-build/corpus.json.gz > /tmp/madarij/app/src/main/assets/corpus.json
          cd /tmp/madarij
          chmod +x gradlew
          ./gradlew --version

      - name: Verify corpus
        shell: bash
        run: |
          cd /tmp/madarij
          python3 -m tools.content_gate app/src/main/assets/corpus.json

      - name: Build debug APK
        shell: bash
        run: |
          cd /tmp/madarij
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Volume1-v1.8-literary-debug
          path: /tmp/madarij/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
