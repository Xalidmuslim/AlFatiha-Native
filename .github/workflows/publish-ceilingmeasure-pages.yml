name: Publish CeilingMeasure Web

on:
  push:
    branches: [ ceilingmeasure-web-v184 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable or update GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          BODY='{"source":{"branch":"ceilingmeasure-web-v184","path":"/"}}'

          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}" \
            -d "${BODY}")

          if [ "${code}" = "201" ]; then
            cat /tmp/pages-response.json
            exit 0
          fi

          if [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" \
              -d "${BODY}")
          fi

          cat /tmp/pages-response.json
          test "${code}" = "204"
