name: Build Android APK + AAB

on:
  push:
    branches: [ main, heart-prayer-azkar-integration-2026-10-02, feature/qudsi-deeper-commentary-2026-10-06 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Verify content and navigation contracts
        run: python3 scripts/verify_content.py
      - name: Lint Android
        run: ./gradlew lintDebug
      - name: Build debug APK and release AAB
        run: ./gradlew assembleDebug bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish permanent APK link
        if: github.ref == 'refs/heads/heart-prayer-azkar-integration-2026-10-02' && contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          TAG="v${VERSION}"
          ASSET="AlFatiha-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --title "AlFatiha ${VERSION}" \
              --notes "Stable APK build ${VERSION}."
          fi
