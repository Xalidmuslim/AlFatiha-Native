name: Build Android APK + AAB

on:
  push:
    branches: [ main, heart-prayer-azkar-integration-2026-10-02 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Verify content and navigation contracts
        run: python3 scripts/verify_content.py
      - name: Lint Android
        run: ./gradlew lintDebug
      - name: Build debug APK and release AAB
        run: ./gradlew assembleDebug bundleRelease
      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Add APK download link to build summary
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "[Download AlFatiha-APK (ZIP containing app-debug.apk)]($APK_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent APK link
        if: github.ref == 'refs/heads/heart-prayer-azkar-integration-2026-10-02' && contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          TAG="v${VERSION}"
          ASSET="AlFatiha-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --title "AlFatiha ${VERSION}" \
              --notes "Stable APK build ${VERSION}."
          fi
