name: Compass Premium Home R8 QA

on:
  push:
    branches: [codex/compass-marckscript-premium-card-motion-20261108]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Preserve motion, content and navigation contracts
        run: |
          python3 scripts/verify_compass_premium_home.py
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Azkar regression tests, lint and R8 APK
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assemblePremiumHomeCompare --no-daemon --stacktrace
      - name: Validate isolated signed APK and bundled fonts
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/premiumHomeCompare/app-premiumHomeCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.premiumhome1108'
          unzip -l "$APK" | grep -F 'assets/fonts/MarckScript-Regular.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload APK for Android installation
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Premium-Home-R8-APK
          path: app/build/outputs/apk/premiumHomeCompare/app-premiumHomeCompare.apk
          retention-days: 30
          if-no-files-found: error
