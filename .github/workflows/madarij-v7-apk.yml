name: Build Madarij v7 APK

on:
  push:
    branches: [ build/madarij-v7-apk ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download Madarij v7 source
        run: |
          curl -fL --retry 3 -o madarij-v7.zip "https://cdn.creativeclaw.co/u/5fdd59ac/zips/ea7b80d6-1bdd-44f1-a7e5-b6006f8e76f9.zip"
          mkdir madarij
          unzip -q madarij-v7.zip -d madarij

      - name: Build debug APK
        working-directory: madarij
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-v7-design-debug
          path: madarij/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
