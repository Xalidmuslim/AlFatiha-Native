name: Build Madarij v8 APK

on:
  push:
    branches: [ build/madarij-v7-apk ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download Madarij v8 source
        run: |
          curl -fL --retry 3 -o madarij-v8.zip "https://cdn.creativeclaw.co/u/5fdd59ac/zips/e189f9c4-43f3-4d34-9e09-b5eeb8589d61.zip"
          mkdir madarij
          unzip -q madarij-v8.zip -d madarij

      - name: Build debug APK
        working-directory: madarij/Madarij-Native
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-v8-polish-debug
          path: madarij/Madarij-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
