name: Medicine Reader scroll-layer A-B APK

on:
  push:
    branches: [codex/compass-reader-scroll-layer-ab-20261103]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-scroll-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Guard reading selection and entry performance
        run: |
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_content.py
      - name: Unit tests and R8 scroll A/B APK
        run: ./gradlew :azkar:testDebugUnitTest :app:assembleScrollCompare --no-daemon --stacktrace
      - name: Verify APK package, signature and bundled book
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/scrollCompare/app-scrollCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.medicinescrollcompare1103'
          unzip -l "$APK" | grep -F 'assets/book.json'
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Medicine-Scroll-AB
          path: app/build/outputs/apk/scrollCompare/app-scrollCompare.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=compass-medicine-scroll-ab-20261103
          APK="$RUNNER_TEMP/Compass-Heart-Medicine-Scroll-AB.apk"
          cp app/build/outputs/apk/scrollCompare/app-scrollCompare.apk "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Compass Heart — Medicine scrolling A/B" \
              --notes "Isolated R8 diagnostic. Removes the Reader LazyColumn graphics layer after its 110ms entry fade; keeps text selection and source chapters unchanged. This is not a performance-validated production release." \
              --prerelease
          fi
