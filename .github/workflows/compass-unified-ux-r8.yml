name: Compass Unified UX R8 APK

on:
  push:
    branches: [codex/compass-ux-unified-20261109]
  workflow_dispatch:

concurrency:
  group: compass-ux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: UX and content regression checks
        run: |
          set -e
          python3 scripts/verify_compass_unified_ux.py
          python3 scripts/verify_compass_sand_spring.py
          python3 scripts/verify_compass_premium_home.py
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Unit tests, lint and isolated APK build
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assembleUnifiedUXCompare --no-daemon --stacktrace
      - name: Inspect installable APK and content
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/unifiedUXCompare/app-unifiedUXCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.compassux1109'
          unzip -l "$APK" | grep -F 'assets/fonts/Neucha.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Unified-UX-20261109
          path: app/build/outputs/apk/unifiedUXCompare/app-unifiedUXCompare.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified standalone APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=compass-heart-unified-ux-20261109
          APK="$RUNNER_TEMP/Compass-Heart-Unified-UX-20261109.apk"
          cp app/build/outputs/apk/unifiedUXCompare/app-unifiedUXCompare.apk "$APK"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Компас сердца — единый дизайн и анимации" \
              --notes "Отдельная тестовая APK. Минимальные матовые поверхности, читаемые карточки, мягкая пружина, режим чтения, настройки анимаций и интервала, поиск с цитатами и прямым переходом к главам Медицины Пророка. Текущая установленная версия и её данные сохраняются." \
              --prerelease
          fi
