name: Compass Azkar Insights and Compact Progress R8 APK

on:
  push:
    branches: [codex/compass-azkar-insights-progress-20261112]
  workflow_dispatch:

concurrency:
  group: compass-azkar-insights-progress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify insights, period tabs, navigator, progress and content
        run: |
          set -e
          python3 scripts/verify_azkar_tarifi_edition.py
          python3 scripts/verify_azkar_amal_text_review.py
          python3 scripts/verify_azkar_mulk_verse_layout.py
          python3 scripts/verify_compass_azkar_dashboard_ux.py
          python3 scripts/verify_compass_unified_ux.py
          python3 scripts/verify_compass_sand_spring.py
          python3 scripts/verify_compass_premium_home.py
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Azkar unit tests, Android lint and R8 insights APK
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assembleAzkarInsightsCompare --no-daemon --stacktrace
      - name: Verify APK and bundled content
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/azkarInsightsCompare/app-azkarInsightsCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.azkarinsights1112'
          unzip -l "$APK" | grep -F 'assets/fonts/Neucha.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload separate APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Azkar-Insights-Progress-20261112
          path: app/build/outputs/apk/azkarInsightsCompare/app-azkarInsightsCompare.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish tested standalone APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=compass-heart-azkar-insights-progress-20261112
          APK="$RUNNER_TEMP/Compass-Heart-Azkar-Insights-Progress-20261112.apk"
          cp app/build/outputs/apk/azkarInsightsCompare/app-azkarInsightsCompare.apk "$APK"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Компас сердца — разъяснения азкаров, капелька и компактный прогресс" \
              --notes "Тестовая APK: 22 азкара со смыслом, пользой, практикой и источниками; три раскрывающиеся секции вместо пяти и адаптивный нижний лист; убрать дублирующий Продолжить азкары; переключатель Утро/Вечер/Ночь с жидким индикатором и разными значками; полезный личный навигатор с главного экрана; меньше жаргона в малом ширке; компактная аналитика с кольцевой диаграммой, шкалами охвата/точности и разделов. Сохранены книги, ранее внесённые тексты, счётчики и пользовательские данные. Требуется ручная визуальная проверка на устройстве; статические и JVM проверки не измеряют FPS." \
              --prerelease
          fi
