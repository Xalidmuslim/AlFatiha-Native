name: Compass Arabic Locale Foundation QA

on:
  push:
    branches: [codex/compass-full-arabic-localization-20261010]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arabic-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android dependencies
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify original course data and Arabic translation contracts
        run: |
          python3 scripts/verify_content.py
          python3 scripts/verify_arabic_locale.py
      - name: Build isolated R8 native Arabic preview
        run: ./gradlew :app:assembleSmoothPreview --no-daemon --stacktrace
      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/smoothPreview/app-smoothPreview.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.arpreview148'
          unzip -l "$APK" | grep -F 'assets/ar/prayer_intro.json'
          unzip -l "$APK" | grep -F 'assets/book.json'
      - name: Save Arabic preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Arabic-RTL-Home-Fix-v1.3.48-APK
          path: app/build/outputs/apk/smoothPreview/app-smoothPreview.apk
          retention-days: 30
          if-no-files-found: error
