name: Madarij v1.16 premium native redesign
on:
  push:
    branches: [madarij-v116-premium-20261007]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source and existing development signing
        shell: bash
        run: |
          mkdir -p source /tmp/signing-source
          cat premium-payload/part-*.b64 | base64 -d > /tmp/premium.tar.xz
          tar -xJf /tmp/premium.tar.xz -C source
          cat payload/part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/baseline.tar.xz
          tar -xJf /tmp/baseline.tar.xz -C /tmp/signing-source
          mkdir -p source/development-signing
          cp /tmp/signing-source/development-signing/debug.keystore source/development-signing/debug.keystore
          chmod +x source/gradlew
      - name: Native compile and existing unit tests
        working-directory: source
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Madarij-v1.18-premium-native-APK
          path: source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android UI smoke pass
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            adb install source/app/build/outputs/apk/release/app-release.apk
            python3 ci/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Madarij-native-QA
          path: qa/
