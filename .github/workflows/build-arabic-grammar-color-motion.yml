name: Build Arabic Grammar Color Motion

on:
  push:
    branches:
      - arabic-grammar-color-motion-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ag
          cat ag-source-parts/part_*.b64 | base64 -d > /tmp/ag/source.zip
          echo "a207e6f3156c9b62e03566991fcf51f11883db07ab7fecf1c38253a4ab82a160  /tmp/ag/source.zip" | sha256sum -c -
          unzip -t /tmp/ag/source.zip
          mkdir -p /tmp/ag/project
          unzip -q /tmp/ag/source.zip -d /tmp/ag/project
          echo "e13bf794cd58226b78e206b6f050cad9cd051de0b22ceebb45ed04075cf4bce5  /tmp/ag/project/app/src/main/assets/book/book.db" | sha256sum -c -
          grep -F 'versionName = "1.3.9-native"' /tmp/ag/project/app/build.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: /tmp/ag/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/ag/project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/ag/apk-verification.txt
          sha256sum "$APK" | tee -a /tmp/ag/apk-verification.txt
          sha256sum /tmp/ag/project/app/src/main/assets/book/book.db | tee -a /tmp/ag/apk-verification.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicGrammar-Haibullin-1.3.9-color-motion
          path: |
            /tmp/ag/project/app/build/outputs/apk/debug/app-debug.apk
            /tmp/ag/apk-verification.txt
          if-no-files-found: error
          retention-days: 7
