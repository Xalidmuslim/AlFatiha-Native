name: Compass Soft Home R8 QA

on:
  push:
    branches:
      - codex/compass-reminder-handwriting-soft-home-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Source-contract regression tests
        run: |
          python3 scripts/verify_compass_soft_home.py
          python3 scripts/verify_compass_full_morph.py
          python3 scripts/verify_compass_morph.py
          python3 scripts/verify_medicine_entry.py
          python3 scripts/verify_medicine_scroll_layer.py
          python3 scripts/verify_content.py
      - name: Azkar tests, lint and separately installable R8 APK
        run: ./gradlew :azkar:testDebugUnitTest :app:lintDebug :app:assembleSoftHomeCompare --no-daemon --stacktrace
      - name: Verify package, assets and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/softHomeCompare/app-softHomeCompare.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.alfatiha.tafsir.compasssofthome1107'
          unzip -l "$APK" | grep -F 'assets/fonts/Caveat.ttf'
          unzip -l "$APK" | grep -F 'assets/book.json'
          sha256sum "$APK"
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Heart-Soft-Home-R8-APK
          path: app/build/outputs/apk/softHomeCompare/app-softHomeCompare.apk
          retention-days: 30
          if-no-files-found: error
