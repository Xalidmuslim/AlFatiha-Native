name: Build APK 1.3.33 macOS

on:
  push:
    branches:
      - build/apk-1.3.33-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify content and navigation contracts
        run: python3 scripts/verify_content.py

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlFatiha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
